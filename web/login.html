<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In · camDetection</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --panel-2: #1f2530; --border: #2a313d;
    --text: #e8ecf2; --muted: #8b95a5; --accent: #4f9cff; --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(circle at 30% 20%, #1a2333 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 18px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .logo {
    width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 14px;
    background: linear-gradient(135deg, #4f9cff, #a259ff); font-size: 28px;
  }
  h1 { text-align: center; font-size: 22px; margin: 0 0 4px; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 26px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 7px; }
  input {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,156,255,.2); }
  button {
    width: 100%; font: inherit; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer;
    background: var(--accent); border: 0; border-radius: 10px; padding: 13px; margin-top: 6px;
  }
  button:hover { filter: brightness(1.1); }
  .error {
    display: none; background: rgba(255,93,93,.12); border: 1px solid rgba(255,93,93,.4); color: #ffb4b4;
    border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="logo">👁️</div>
    <h1>camDetection</h1>
    <p class="sub">Log in to view the camera</p>
    <div class="error" id="error">❌ Wrong username or password.</div>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
<script>
  if (new URLSearchParams(location.search).has("error")) document.getElementById("error").classList.add("show");
</script>
</body>
</html>
